name: Extract approved Level 2 gym art
on:
  push:
    branches: [release/levels-1-2]
    paths: [scripts/extract-approved-level2-props.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/levels-1-2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/extract-approved-level2-props.py
      - name: Commit transparent approved sprites
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add art-source/extracted/level2/
          if ! git diff --cached --quiet; then
            git commit -m "art: add 26 approved transparent Level 2 gym props"
            git pull --rebase origin release/levels-1-2
            git push origin HEAD:release/levels-1-2
          fi
