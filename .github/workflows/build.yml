name: Build check
on:
  push:
    branches: [main, feat/living-gym-ai]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --check level1-user-edited-images.js
      - run: node --check level1-visual-fixes.js
      - run: node --check level1-equipment-and-interactions.js
      - run: node --check level1-training-equipment-behavior.js
      - run: node --check level1-approved-coaches.js
      - name: Verify approved male and female coach source atlases
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,struct
          for gender,sha in [
            ("male","ea0e0d22d2ea2b9a9d908a691363658b359f8e4796eca2a1138795c704dd7e74"),
            ("female","090d320e404c107795bb36756bd6131aa72f2afc716120984b46b1d8ad8f6bb9")
          ]:
            b=Path(f"level1-approved-coach-{gender}.png").read_bytes()
            assert b[:8] == bytes.fromhex("89504e470d0a1a0a")
            assert struct.unpack(">II",b[16:24]) == (576,192)
            assert hashlib.sha256(b).hexdigest() == sha
          PY
      - name: Verify exact user-supplied wall PNG
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,struct
          wall=Path("level1-original-wall.png").read_bytes()
          assert wall[:8] == bytes.fromhex("89504e470d0a1a0a")
          assert struct.unpack(">II",wall[16:24]) == (2048,682)
          assert hashlib.sha256(wall).hexdigest() == "874d8631068a7000ea67e7429aaa1687cef0ad4daeb11dc1197639646bd0619d"
          fixes=Path("level1-visual-fixes.js").read_text()
          assert 'cc-l1-native-user-wall-20261115' in fixes
          assert 'wall: ORIGINAL_WALL' in fixes
          assert 'sc.__ccL1Objects?.wall' in fixes
          assert 'wall.setTexture(textureKey)' in fixes
          assert 'ctx.drawImage(img, 0, 0, img.naturalWidth, visibleSourceHeight' in fixes
          assert 'const visuals = [...shutter.sprites' in fixes
          assert 'if (item === wall) continue;' in fixes
          assert 'sc.add.image(0, 0, textureKey)' not in fixes
          menu=Path("level1-equipment-and-interactions.js").read_text()
          assert "sc.openInventoryCategory = function(kind, ...args)" in menu
          assert "if (sc.isPlacing()) sc.cancelPlacement();" in menu
          assert "const subtitle = sc.furniturePanel.list.find" in menu
          assert "BALANCE: $" not in menu
          PY
      - run: node --check level1-user-updated-equipment.js
      - name: Verify user equipment atlas
        run: |
          python3 - <<'PY'
          import struct
          from pathlib import Path
          b = Path("level1-updated-equipment-atlas.png").read_bytes()
          assert b[:8] == b"\x89PNG\r\n\x1a\n"
          assert struct.unpack(">II", b[16:24]) == (390, 200)
          PY
      - run: npm run build
