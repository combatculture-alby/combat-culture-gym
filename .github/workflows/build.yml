name: Build check
on:
  push:
    branches: [main, feat/living-gym-ai]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --check level1-user-edited-images.js
      - run: node --check level1-visual-fixes.js
      - run: node --check level1-user-updated-equipment.js
      - name: Verify user equipment atlas
        run: |
          python3 - <<'PY'
          import struct
          from pathlib import Path
          b = Path("level1-updated-equipment-atlas.png").read_bytes()
          assert b[:8] == b"\x89PNG\r\n\x1a\n"
          assert struct.unpack(">II", b[16:24]) == (390, 200)
          PY
      - run: npm run build
