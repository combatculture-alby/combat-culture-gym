name: Build check
on:
  push:
    branches: [main, feat/living-gym-ai]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run build
      - name: Install Chromium for headless hub tests
        run: npx playwright install --with-deps chromium
      - name: Exercise garage progression in Chromium
        run: npm run test:browser
      - name: Upload QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: garage-browser-qa
          path: browser-artifacts/
          if-no-files-found: ignore
