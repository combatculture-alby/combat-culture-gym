name: Build check
on:
  push:
    branches: [main, feat/living-gym-ai]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node --check level1-visual-fixes.js
      - run: npm run build
