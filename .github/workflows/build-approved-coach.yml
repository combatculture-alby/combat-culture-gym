name: Build approved coach sprite
on:
  push:
    branches: [release/levels-1-2]
    paths: [scripts/build-approved-coach.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/levels-1-2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/build-approved-coach.py
      - name: Commit coach PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/coach-approved.png
          if ! git diff --cached --quiet; then
            git commit -m "art: install approved animated coach sprite"
            git pull --rebase origin release/levels-1-2
            git push origin HEAD:release/levels-1-2
          fi
