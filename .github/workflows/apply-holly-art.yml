name: Apply approved Holly sprite correction
on:
  push:
    branches: [release/levels-1-2]
    paths:
      - scripts/fix-holly-atlas.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/levels-1-2
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - run: python scripts/fix-holly-atlas.py
      - name: Commit corrected PNG to the release branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/assets/holly.png
          if git diff --cached --quiet; then
            echo "Holly atlas already corrected."
          else
            git commit -m "art: apply approved Holly sprite cleanup"
            git push origin HEAD:release/levels-1-2
          fi
