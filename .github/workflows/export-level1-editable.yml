name: Export editable Level 1 pixel art
on:
  push:
    branches: [assets/level1-editable-sprite-pack]
    paths-ignore:
      - 'exports/**'
jobs:
  export:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install Pillow
      - name: Export original and 8x PNGs
        run: python scripts/export_level1_sprites.py
      - name: Commit sprite ZIP and PNGs to the export branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add exports/
          if ! git diff --cached --quiet; then
            git commit -m "Publish native Level 1 sprite editing pack"
            git push origin HEAD:assets/level1-editable-sprite-pack
          fi
