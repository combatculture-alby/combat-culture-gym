name: Deploy game
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '*/15 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      # Keep the production game at the root. Build the unmerged overhaul
      # separately under /preview/ so playtesting never replaces production.
      - uses: actions/checkout@v4
        with:
          ref: feat/living-gym-ai
          path: preview-source
      - name: Build Living Gym preview
        working-directory: preview-source
        env:
          VITE_ISOLATE_SAVE: '1'
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit
          npx vite build --base=/combat-culture-gym/preview/
      - name: Add preview alongside production
        run: |
          mkdir -p dist/preview
          cp -R preview-source/dist/. dist/preview/
      # Independent hub QA build. Keep its save data separate from production.
      - uses: actions/checkout@v4
        with:
          ref: feat/hub-completion-independent
          path: test-source
      - name: Build independent hub test
        working-directory: test-source
        env:
          VITE_ISOLATE_SAVE: '1'
        run: |
          npm install --no-audit --no-fund
          npm run build -- --base=/combat-culture-gym/test/
      - name: Add hub test alongside production
        run: |
          mkdir -p dist/test
          cp -R test-source/dist/. dist/test/
      # The isolated Level 1-2 garage preview now includes the supplied pixel-art
      # atlases and character sprites. Production root remains unchanged.
      # Refresh preview after Level 1-2 browser regression suite passed on f5fa629.
      # Rebuild the tested garage day loop with opening prep, staggered attendance and closing carryover.
      # Approved six-NPC atlas integration checked in release/levels-1-2.
      # Unmerged garage progression is published as a separate playable build.
      # It never replaces the production root or the existing preview/test builds.
      - uses: actions/checkout@v4
        with:
          ref: release/levels-1-2
          path: garage-source
      - name: Build Level 1-2 development playtest
        working-directory: garage-source
        env:
          VITE_ISOLATE_SAVE: '1'
          VITE_GARAGE_PREVIEW: '1'
          VITE_LEVELS_PLAYTEST: '1'
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit
          npm run build -- --base=/combat-culture-gym/garage/
      - name: Add garage preview alongside production
        run: |
          mkdir -p dist/garage
          cp -R garage-source/dist/. dist/garage/
      - name: Verify the isolated garage build was packaged
        run: |
          test -f dist/garage/index.html
          test -n "$(find dist/garage/assets -name '*.png' -print -quit)"
          grep -q '/combat-culture-gym/garage/assets/' dist/garage/index.html
          test -n "$(find dist/garage/assets -name '*.js' -print -quit)"
      # Build the isolated Levels 1–2 release candidate for player testing.
      # Production and existing previews remain untouched.
      - uses: actions/checkout@v4
        with:
          ref: release/levels-1-2
          path: levels-source
      # Publish the release branch only after its standalone browser QA passed.
      - name: Build Levels 1–2 playtest
        working-directory: levels-source
        env:
          VITE_LEVELS_PLAYTEST: '1'
          VITE_ISOLATE_SAVE: '1'
        run: |
          npm install --no-audit --no-fund
          npm run build -- --base=/combat-culture-gym/levels-1-2/
      - name: Add Levels 1–2 playtest alongside production
        run: |
          mkdir -p dist/levels-1-2
          cp -R levels-source/dist/. dist/levels-1-2/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
