name: Deploy game
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      # Keep the production game at the root. Build the unmerged overhaul
      # separately under /preview/ so playtesting never replaces production.
      - uses: actions/checkout@v4
        with:
          ref: feat/gym-world-overhaul
          path: preview-source
      - name: Build overhaul preview
        working-directory: preview-source
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit
          npx vite build --base=/combat-culture-gym/preview/
      - name: Add preview alongside production
        run: |
          mkdir -p dist/preview
          cp -R preview-source/dist/. dist/preview/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
