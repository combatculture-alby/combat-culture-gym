name: Deploy game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run build
      # Keep the production game at the root. Build the unmerged overhaul
      # separately under /preview/ so playtesting never replaces production.
      - uses: actions/checkout@v4
        with:
          ref: feat/living-gym-ai
          path: preview-source
      - name: Build Living Gym preview
        working-directory: preview-source
        env:
          VITE_ISOLATE_SAVE: '1'
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit
          npx vite build --base=/combat-culture-gym/preview/
      - name: Add preview alongside production
        run: |
          mkdir -p dist/preview
          cp -R preview-source/dist/. dist/preview/
      # Independent hub QA build. Keep its save data separate from production.
      - uses: actions/checkout@v4
        with:
          ref: feat/hub-completion-independent
          path: test-source
      - name: Build independent hub test
        working-directory: test-source
        env:
          VITE_ISOLATE_SAVE: '1'
        run: |
          npm install --no-audit --no-fund
          npm run build -- --base=/combat-culture-gym/test/
      - name: Add hub test alongside production
        run: |
          mkdir -p dist/test
          cp -R test-source/dist/. dist/test/
      # The isolated Level 1-2 garage preview now includes the supplied pixel-art
      # atlases and character sprites. Production root remains unchanged.
      # Refresh preview after Level 1 white matte cleanup and regenerated art QA at d6da9a11.
      # Rebuild the tested garage day loop with opening prep, staggered attendance and closing carryover.
      # Approved six-NPC atlas integration checked in release/levels-1-2.
      # Refresh isolated Level 1 folding-table reception desk visual test.
      # Enlarge approved folding desk for Level 1 visual review.
      # Raise folding desk away from lower screen edge.
      # Deploy approved clean replacement desk sprite to isolated garage preview.
      # Unmerged garage progression is published as a separate playable build.
      # It never replaces the production root or the existing preview/test builds.
      - uses: actions/checkout@v4
        with:
          ref: release/levels-1-2
          path: garage-source
      - name: Build Level 1-2 development playtest
        working-directory: garage-source
        env:
          VITE_ISOLATE_SAVE: '1'
          VITE_GARAGE_PREVIEW: '1'
          VITE_LEVELS_PLAYTEST: '1'
        run: |
          npm install --no-audit --no-fund
          npx tsc --noEmit
          npm run build -- --base=/combat-culture-gym/garage/
      - name: Add garage preview alongside production
        run: |
          mkdir -p dist/garage
          cp -R garage-source/dist/. dist/garage/
      - name: Verify the isolated garage build was packaged
        run: |
          test -f dist/garage/index.html
          test -n "$(find dist/garage/assets -name '*.png' -print -quit)"
          grep -q '/combat-culture-gym/garage/assets/' dist/garage/index.html
          test -n "$(find dist/garage/assets -name '*.js' -print -quit)"
      # Build the isolated Levels 1–2 release candidate for player testing.
      # Production and existing previews remain untouched.
      - uses: actions/checkout@v4
        with:
          ref: release/levels-1-2
          path: levels-source
      # Publish the release branch only after its standalone browser QA passed.
      - name: Build Levels 1–2 playtest
        working-directory: levels-source
        env:
          VITE_LEVELS_PLAYTEST: '1'
          VITE_ISOLATE_SAVE: '1'
        run: |
          npm install --no-audit --no-fund
          npm run build -- --base=/combat-culture-gym/levels-1-2/
      - name: Add Levels 1–2 playtest alongside production
        run: |
          mkdir -p dist/levels-1-2
          cp -R levels-source/dist/. dist/levels-1-2/
      # Publish the approved self-contained Level 1 playtest separately from production.
      # Upload parts are concatenated byte-for-byte to avoid upload transport limits.
      - name: Publish approved Level 1 playtest
        run: |
          test "$(find approved-level1-parts -name 'part-*.txt' | wc -l)" -eq 15
          mkdir -p dist/offline
          cat approved-level1-parts/part-*.txt > dist/offline/index.html
          test "$(wc -c < dist/offline/index.html)" -gt 11000000
          grep -qi '<html' dist/offline/index.html
          grep -q 'window.CC_GAME' dist/offline/index.html
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,struct
          wall = Path("level1-original-wall.png").read_bytes()
          assert wall[:8] == bytes.fromhex("89504e470d0a1a0a")
          assert struct.unpack(">II",wall[16:24]) == (2048,682)
          assert hashlib.sha256(wall).hexdigest() == "874d8631068a7000ea67e7429aaa1687cef0ad4daeb11dc1197639646bd0619d"
          PY
          node --check level1-user-edited-images.js
          node --check level1-visual-fixes.js
          node --check level1-user-updated-equipment.js
          node --check level1-equipment-and-interactions.js
          python3 - <<'PY'
          from pathlib import Path
          import struct
          atlas = Path("level1-updated-equipment-atlas.png").read_bytes()
          assert atlas[:8] == b"\x89PNG\r\n\x1a\n", "not a PNG"
          assert struct.unpack(">II", atlas[16:24]) == (390, 200), "unexpected atlas dimensions"
          PY
          cp level1-user-edited-images.js dist/offline/level1-user-edited-images.js
          cp level1-visual-fixes.js dist/offline/level1-visual-fixes.js
          cp level1-original-wall.png dist/offline/level1-original-wall.png
          cp level1-user-updated-equipment.js dist/offline/level1-user-updated-equipment.js
          cp level1-updated-equipment-atlas.png dist/offline/level1-updated-equipment-atlas.png
          cp level1-equipment-and-interactions.js dist/offline/level1-equipment-and-interactions.js
          python3 - <<'PY'
          from pathlib import Path
          page = Path("dist/offline/index.html")
          html = page.read_text(encoding="utf-8")
          # Hide the game before its original startup scripts can render.
          # Only the isolated Level 1 preview receives this CSS. Reveal after
          # the first Phaser post-render with user-approved artwork attached.
          assert "</head>" in html and '<main id="game"' in html
          gate = ('<style id="cc-l1-startup-gate">'
                  'html:not(.cc-l1-ready) #game canvas { visibility:hidden !important; }'
                  '</style>')
          html = html.replace("</head>", gate + "</head>", 1)
          pos = html.rfind("</body>")
          assert pos >= 0, "Missing closing body tag"
          page.write_text(html[:pos] + '<script src="./level1-user-edited-images.js?v=new-wall-confirm-20261115"></script><script src="./level1-user-updated-equipment.js?v=clean-equipment-20261115"></script><script src="./level1-visual-fixes.js?v=exact-original-wall-2048-682-20261115"></script><script src="./level1-equipment-and-interactions.js?v=consistent-gear-walk-cash-1"></script>' + html[pos:], encoding="utf-8")
          PY
          grep -q 'level1-user-edited-images.js' dist/offline/index.html
          grep -q 'level1-visual-fixes.js' dist/offline/index.html
          grep -q 'cc-l1-startup-gate' dist/offline/index.html
          test -s dist/offline/level1-visual-fixes.js
          test -s dist/offline/level1-original-wall.png
          test -s dist/offline/level1-equipment-and-interactions.js
          test -s dist/offline/level1-user-updated-equipment.js
          test -s dist/offline/level1-updated-equipment-atlas.png
          grep -q 'level1-user-updated-equipment.js' dist/offline/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4

